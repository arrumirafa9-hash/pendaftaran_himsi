<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Anggota HIMSI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Background Cyber Tech */
        body {
            background-color: #040914;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(14, 116, 144, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 20% 80%, rgba(30, 58, 138, 0.3) 0%, transparent 50%),
                url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 9, 20, 0.88);
            z-index: 0;
            pointer-events: none;
        }

        /* Kotak Kartu Utama dengan Aksen Sirkuit Cyber */
        .cyber-card {
            background: rgba(10, 15, 30, 0.93);
            backdrop-filter: blur(16px);
            border: 2px solid #06b6d4;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.25), inset 0 0 20px rgba(6, 182, 212, 0.1);
            position: relative;
            overflow: hidden;
        }

        /* Dekorasi SVG Jalur Kabel Sirkuit Siku & Titik Node di Sudut */
        .circuit-corner-tl {
            position: absolute;
            top: 0; left: 0;
            width: 70px; height: 70px;
            pointer-events: none;
            opacity: 0.85;
        }
        .circuit-corner-br {
            position: absolute;
            bottom: 0; right: 0;
            width: 70px; height: 70px;
            pointer-events: none;
            transform: rotate(180deg);
            opacity: 0.85;
        }

        /* Kotak Input ala Terminal / Panel Sistem */
        .cyber-input {
            background: rgba(3, 7, 18, 0.95);
            border: 1px solid rgba(6, 182, 212, 0.5);
            color: #f8fafc;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.8), 0 0 8px rgba(6, 182, 212, 0.1);
            transition: all 0.3s ease;
        }
        .cyber-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5), inset 0 2px 5px rgba(0, 0, 0, 0.8);
            outline: none;
        }

        /* Garis Pemisah Sirkuit Tengah */
        .circuit-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #06b6d4, #38bdf8, #06b6d4, transparent);
            box-shadow: 0 0 10px #06b6d4;
            margin: 14px 0;
            position: relative;
        }
        .circuit-divider::after {
            content: '';
            position: absolute;
            top: -3px; left: 50%;
            transform: translateX(-50%);
            width: 8px; height: 8px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 8px #38bdf8;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-4 md:p-8 relative">
    
    <!-- Template SVG Jalur Kabel Sirkuit Siku & Titik Node -->
    <svg style="display: none;">
        <g id="circuit-path">
            <path d="M 0 15 L 25 15 L 40 30 L 65 30" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" style="filter: drop-shadow(0 0 4px #06b6d4);"/>
            <circle cx="40" cy="30" r="3.5" fill="#38bdf8" style="filter: drop-shadow(0 0 6px #38bdf8);" />
            <circle cx="65" cy="30" r="2.5" fill="#06b6d4" />
            <path d="M 15 0 L 15 40 L 25 50 L 50 50" fill="none" stroke="#06b6d4" stroke-width="2" />
        </g>
    </svg>

    <div class="max-w-4xl mx-auto space-y-6 relative z-10">
        <!-- Header dengan Logo Kiri & Kanan -->
        <div class="cyber-card p-6 rounded-2xl flex items-center justify-between gap-4">
            <svg class="circuit-corner-tl"><use href="#circuit-path"/></svg>
            <svg class="circuit-corner-br"><use href="#circuit-path"/></svg>

            <!-- Logo Kiri (4984.jpg) -->
            <div class="w-16 h-16 sm:w-20 sm:h-20 flex-shrink-0 bg-slate-950/90 rounded-xl border border-cyan-400 flex items-center justify-center p-1.5 overflow-hidden shadow-[0_0_15px_rgba(6,182,212,0.4)] z-10">
                <img src="4984.jpg" alt="Logo HIMSI" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/80x80/0f172a/38bdf8?text=HIMSI'">
            </div>

            <!-- Judul Tengah -->
            <div class="text-center flex-grow z-10">
                <span class="text-[10px] sm:text-xs uppercase tracking-widest text-cyan-300 font-bold bg-cyan-950/80 px-3 py-1 rounded-full border border-cyan-500 shadow-[0_0_10px_rgba(6,182,212,0.5)]">Open Recruitment</span>
                <h1 class="text-xl sm:text-2xl font-black text-white mt-2 tracking-wide">Pendaftaran Anggota HIMSI</h1>
                <p class="text-xs sm:text-sm text-slate-300 mt-0.5">Himpunan Mahasiswa Sistem Informasi • ITB Swadharma</p>
            </div>

            <!-- Logo Kanan (4987.jpg) -->
            <div class="w-16 h-16 sm:w-20 sm:h-20 flex-shrink-0 bg-slate-950/90 rounded-xl border border-cyan-400 flex items-center justify-center p-1.5 overflow-hidden shadow-[0_0_15px_rgba(6,182,212,0.4)] z-10">
                <img src="4987.jpg" alt="Logo ITBS" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/80x80/0f172a/38bdf8?text=ITBS'">
            </div>
        </div>

        <!-- Form Pendaftaran dengan Aksen Kabel Sirkuit Sudut -->
        <div class="cyber-card p-6 sm:p-8 rounded-2xl">
            <svg class="circuit-corner-tl"><use href="#circuit-path"/></svg>
            <svg class="circuit-corner-br"><use href="#circuit-path"/></svg>

            <div class="mb-4 pb-2 flex items-center justify-between relative z-10">
                <div class="flex items-center gap-2">
                    <span class="text-lg">🤖</span>
                    <span class="text-xs font-mono text-cyan-300 tracking-wider font-bold">>> SYSTEM_CIRCUIT_NODE_PORTAL</span>
                </div>
                <span class="flex h-2 w-2 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-cyan-500"></span>
                </span>
            </div>
            
            <div class="circuit-divider"></div>

            <form id="pendaftaranForm" class="space-y-4 pt-2 relative z-10">
                <div>
                    <label class="block text-sm font-semibold text-cyan-300 mb-1 flex items-center gap-1.5">
                        <span>⚡</span> Nama Lengkap
                    </label>
                    <input type="text" id="nama" required class="w-full cyber-input rounded-xl px-4 py-3 placeholder-slate-500" placeholder="Masukkan nama lengkap">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-cyan-300 mb-1 flex items-center gap-1.5">
                            <span>🔌</span> NIM
                        </label>
                        <input type="text" id="nim" required class="w-full cyber-input rounded-xl px-4 py-3 placeholder-slate-500" placeholder="Masukkan NIM">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-cyan-300 mb-1 flex items-center gap-1.5">
                            <span>💬</span> Nomor HP / WhatsApp
                        </label>
                        <input type="tel" id="no_hp" required class="w-full cyber-input rounded-xl px-4 py-3 placeholder-slate-500" placeholder="Contoh: 081234567890">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-cyan-300 mb-1 flex items-center gap-1.5">
                        <span>🌐</span> Alamat Email Aktif
                    </label>
                    <input type="email" id="email" required class="w-full cyber-input rounded-xl px-4 py-3 placeholder-slate-500" placeholder="Contoh: nama@gmail.com">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-cyan-300 mb-1 flex items-center gap-1.5">
                        <span>💡</span> Alasan Masuk HIMSI
                    </label>
                    <textarea id="alasan" rows="3" required class="w-full cyber-input rounded-xl px-4 py-3 placeholder-slate-500 resize-none" placeholder="Tuliskan alasan singkat ingin bergabung dengan HIMSI..."></textarea>
                </div>
                
                <div class="circuit-divider"></div>

                <button type="submit" class="w-full bg-gradient-to-r from-cyan-600 via-blue-600 to-indigo-600 hover:from-cyan-500 hover:to-indigo-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-[0_0_25px_rgba(6,182,212,0.6)] transition duration-200 cursor-pointer tracking-wider uppercase text-sm border-2 border-cyan-400 flex items-center justify-center gap-2">
                    <span>🚀</span> Kirim Pendaftaran
                </button>
            </form>
        </div>

        <!-- Panel Khusus Admin / Pengurus -->
        <div class="cyber-card p-6 sm:p-8 rounded-2xl space-y-4">
            <svg class="circuit-corner-tl"><use href="#circuit-path"/></svg>
            <svg class="circuit-corner-br"><use href="#circuit-path"/></svg>

            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pb-2 relative z-10">
                <div>
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        <span>🔐</span> Panel Rekap Admin
                    </h2>
                    <p class="text-xs text-slate-400 mt-0.5">Khusus pengurus untuk melihat data dan download Excel.</p>
                </div>
                <div id="loginSection" class="flex gap-2 w-full sm:w-auto">
                    <input type="password" id="adminPassword" placeholder="Password Admin" class="cyber-input rounded-xl px-3 py-2 text-sm text-slate-100 placeholder-slate-500">
                    <button onclick="cekAdmin()" class="bg-slate-800 hover:bg-slate-700 text-white text-sm font-medium px-4 py-2 rounded-xl transition duration-200 cursor-pointer border border-cyan-400 shadow-[0_0_10px_rgba(6,182,212,0.3)]">Buka</button>
                </div>
            </div>

            <div class="circuit-divider relative z-10"></div>

            <!-- Bagian Tabel yang Dikunci -->
            <div id="adminPanel" class="hidden space-y-4 pt-2 relative z-10">
                <div class="flex justify-between items-center">
                    <span class="text-sm text-emerald-400 font-medium flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Akses Admin Terbuka
                    </span>
                    <button onclick="exportToCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium py-2 px-4 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.4)] transition duration-200 cursor-pointer border border-emerald-400">
                        Download CSV / Excel
                    </button>
                </div>
                <div class="overflow-x-auto rounded-xl border border-cyan-500/50">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-950/95 border-b border-cyan-500/40 text-cyan-300 text-xs uppercase tracking-wider">
                                <th class="py-3 px-4">Waktu</th>
                                <th class="py-3 px-4">Nama</th>
                                <th class="py-3 px-4">NIM</th>
                                <th class="py-3 px-4">No. HP / WA</th>
                                <th class="py-3 px-4">Email</th>
                                <th class="py-3 px-4">Alasan Masuk</th>
                            </tr>
                        </thead>
                        <tbody id="tabelPendaftar" class="divide-y divide-cyan-950 text-sm">
                            <!-- Data masuk lewat JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('pendaftaranForm');
        const tabelPendaftar = document.getElementById('tabelPendaftar');
        let dataPendaftar = JSON.parse(localStorage.getItem('data_pendaftar_himsi_v3')) || [];

        // PASSWORD ADMIN
        const PASSWORD_RAHASIA = "himsi2026";

        function cekAdmin() {
            const inputPass = document.getElementById('adminPassword').value;
            if (inputPass === PASSWORD_RAHASIA) {
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('loginSection').classList.add('hidden');
                renderTable();
            } else {
                alert('Password salah, bro!');
            }
        }

        function renderTable() {
            tabelPendaftar.innerHTML = '';
            if (dataPendaftar.length === 0) {
                tabelPendaftar.innerHTML = `<tr><td colspan="6" class="py-6 text-center text-slate-500 italic">Belum ada data pendaftar.</td></tr>`;
                return;
            }
            dataPendaftar.forEach((item) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="py-3 px-4 text-slate-400 whitespace-nowrap text-xs">${item.waktu}</td>
                    <td class="py-3 px-4 font-medium text-slate-100 whitespace-nowrap">${item.nama}</td>
                    <td class="py-3 px-4 text-slate-300 whitespace-nowrap">${item.nim}</td>
                    <td class="py-3 px-4 text-slate-300 whitespace-nowrap">${item.no_hp}</td>
                    <td class="py-3 px-4 text-slate-300 whitespace-nowrap">${item.email}</td>
                    <td class="py-3 px-4 text-slate-300 min-w-[200px]">${item.alasan}</td>
                `;
                tabelPendaftar.appendChild(row);
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const now = new Date();
            const waktuString = now.toLocaleDateString('id-ID') + ' ' + now.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});

            const newData = {
                waktu: waktuString,
                nama: document.getElementById('nama').value,
                nim: document.getElementById('nim').value,
                no_hp: document.getElementById('no_hp').value,
                email: document.getElementById('email').value,
                alasan: document.getElementById('alasan').value
            };

            dataPendaftar.unshift(newData);
            localStorage.setItem('data_pendaftar_himsi_v3', JSON.stringify(dataPendaftar));
            form.reset();
            alert('Pendaftaran berhasil dikirim! Terima kasih.');
        });

        function exportToCSV() {
            if (dataPendaftar.length === 0) {
                alert('Belum ada data buat diexport!');
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,Waktu Daftar,Nama,NIM,No HP,Email,Alasan Masuk\r\n";
            dataPendaftar.forEach(row => {
                let cleanAlasan = row.alasan.replace(/"/g, '""').replace(/(\r\n|\n|\r)/gm, " ");
                csvContent += `"${row.waktu}","${row.nama}","${row.nim}","${row.no_hp}","${row.email}","${cleanAlasan}"\r\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "pendaftar_anggota_himsi.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
